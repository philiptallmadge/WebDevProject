<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Signup Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Monoton&family=Roboto&family=Shadows+Into+Light&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./signup.css" />
  </head>
  <body>
    <!-- Navbar keeps logo on left side at all times. Login and signup stay on right side-->
    <div class="navbar">
      <!--This  will take you back to the main page -->
      <a class="logo" href="../index.html">
        <img
          src="../images/rock_image.png"
          alt="Image of Man Playing Guitar"
          width="50"
          height="50"
        />
      </a>

      <ul>
        <li>
          <a class="navlinks monoton-regular" href="../login/login.html">
            Login</a
          >
        </li>
        <li>
          <a class="navlinks monoton-regular" href="../signup/signup.html">
            Signup
          </a>
        </li>
      </ul>
    </div>
    <form action="/action_page.php">
      <div class="container">
        <h1>Register</h1>
        <p>Please fill in this form to create an account.</p>
        <hr />

        <label for="email"><b>Email</b></label>
        <input
          type="text"
          placeholder="Enter Email"
          name="email"
          id="email"
          required
        />
        <br />
        <label for="psw"><b>Password</b></label>
        <input
          type="password"
          placeholder="Enter Password"
          name="psw"
          id="psw"
          required
        />

        <label for="psw-repeat"><b>Repeat Password</b></label>
        <input
          type="password"
          placeholder="Repeat Password"
          name="psw-repeat"
          id="psw-repeat"
          required
        />
        <hr />

        <p>
          By creating an account you agree to our
          <a href="#">Terms & Privacy</a>.
        </p>

        <button type="submit">Register</button>
      </div>
      <div>
        <p>
          Already have an account?
          <a href="../login/login.html">Sign in</a>.
        </p>
      </div>
    </form>
  </body>
</html>
